packages:
  - packages/*
  - examples/*
  - examples/bundle-fixtures/*
  - docs
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  typescript: ^6.0.0
  typestyles: ^0.35.1
  '@typestyles/vite': ^0.7.0
  '@typestyles/rollup': ^0.6.0
  '@typestyles/build-runner': ^0.8.0
  react: ^19.0.0
  react-dom: ^19.0.0
  react-aria-components: ^1.19.0
  '@internationalized/date': ^3.12.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.0.0
  astro: ^5.14.0
  playwright: 1.61.1
  '@vitest/browser-playwright': 5.0.5
  react-hook-form: ^7.60.0
  zod: ^4.0.0
  '@hookform/resolvers': ^5.0.0
catalogMode: prefer
linkWorkspacePackages: true
onlyBuiltDependencies:
  - esbuild
overrides:
  vite@*: 'catalog:'
  '@var-ui/docs-site>vite': npm:vite@^6.4.1
patchedDependencies:
  astro@5.18.2: patches/astro@5.18.2.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
preferWorkspacePackages: true
