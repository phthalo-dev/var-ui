name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      # Source-shipped Astro packages (@var-ui/astro, @var-ui/docs,
      # @var-ui/docs-components) need no vp pack build before publish.
      - run: vp run -F @var-ui/core -F @var-ui/react -F @var-ui/icons -F @var-ui/cli build

      - uses: changesets/action@v1
        with:
          publish: vp exec changeset publish
          version: vp exec changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets pushes one git tag per package. pre-push runs `vp run ci`,
          # so those pushes race on a single checkout and the release job fails
          # after npm publish. CI already ran on the PR.
          HUSKY: "0"
          VITE_GIT_HOOKS: "0"
